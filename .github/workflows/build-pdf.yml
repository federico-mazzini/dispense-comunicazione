name: Compila PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compila PDF
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pdf]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica i sorgenti
        uses: actions/checkout@v7
      - name: Installa Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'
      - name: Compila il PDF
        run: bash scripts/build.sh
      - name: Carica il PDF scaricabile
        uses: actions/upload-artifact@v7
        with:
          name: dispense-comunicazione-pdf
          path: dist/dispense-comunicazione.pdf
          if-no-files-found: error
          retention-days: 30
