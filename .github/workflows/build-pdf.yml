name: Compila PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compila PDF
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pdf]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica i sorgenti
        uses: actions/checkout@v7
      - name: Installa Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'
      - name: Compila il PDF
        run: bash scripts/build.sh
      - name: Carica il PDF scaricabile
        uses: actions/upload-artifact@v7
        with:
          name: dispense-comunicazione-pdf
          path: dist/dispense-comunicazione.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Carica la presentazione
        uses: actions/upload-artifact@v7
        with:
          name: slide-comunicazione-pdf
          path: dist/slide-comunicazione.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Prepara i PDF per GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    name: Pubblica i PDF
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
